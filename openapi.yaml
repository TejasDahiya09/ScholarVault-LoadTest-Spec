components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase access token
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: UUID unless an endpoint also accepts a generated public/reference id.
    MaterialIdPath:
      name: materialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    YearQuery:
      name: year
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 4
    SemesterQuery:
      name: semester
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 8
    SearchQueryRequired:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PerPageQuery:
      name: per_page
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
  responses:
    Unauthorized:
      description: Missing, invalid, or expired bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlainError"
    PlainBadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlainError"
    PlainForbidden:
      description: Forbidden.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlainError"
    PlainNotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlainError"
    PlainPayloadTooLarge:
      description: Payload too large.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlainError"
    PlainUnsupportedMediaType:
      description: Unsupported media type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlainError"
    PlainServerError:
      description: Server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlainError"
    ApiBadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    ApiForbidden:
      description: Admin role or resource access required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    ApiNotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    ApiConflict:
      description: Invalid resource state transition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    ApiPayloadTooLarge:
      description: Uploaded file exceeds endpoint size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    ApiUnsupportedMediaType:
      description: Uploaded file type is not supported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    ApiServerError:
      description: Server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    AuthRateLimited:
      description: Too many authentication attempts.
      headers:
        RateLimit-Limit:
          schema:
            type: integer
