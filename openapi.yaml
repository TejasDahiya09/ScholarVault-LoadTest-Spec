openapi: 3.0.3
info:
  title: ScholarVault Backend API
  version: 1.0.0
  description: |
    OpenAPI specification generated from the existing Express backend source for HTTP load testing.
    Authentication uses Supabase access tokens supplied as `Authorization: Bearer <token>`.
servers:
  - url: https://scholarvault-backend.onrender.com
    description: Production backend
tags:
  - name: Health
  - name: Auth
  - name: Public
  - name: Subjects
  - name: Notes
  - name: Search
  - name: Files
  - name: Progress
  - name: Bookmarks
  - name: Completions
  - name: Completed
  - name: Uploads
  - name: Feedback
  - name: Admin
  - name: Admin Uploads
  - name: Admin Materials
  - name: Admin Feedback
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Backend health status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  environment:
                    type: string
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Rate limited to 20 authentication attempts per 15 minutes per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login a user
      description: Rate limited to 20 authentication attempts per 15 minutes per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: User logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the current user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current authenticated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/auth/profile:
    put:
      tags: [Auth]
      summary: Update profile name
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/auth/year:
    put:
      tags: [Auth]
      summary: Update selected year
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year]
              additionalProperties: false
              properties:
                year:
                  oneOf:
                    - type: integer
                      minimum: 1
                      maximum: 4
                    - type: string
      responses:
        "200":
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/auth/preferences:
    put:
      tags: [Auth]
      summary: Update user preferences
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesRequest"
      responses:
        "200":
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/auth/account:
    delete:
      tags: [Auth]
      summary: Delete authenticated user account
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account deleted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  message:
                    type: string
                    example: Account deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/auth/reset-history:
    post:
      tags: [Auth]
      summary: Reset study history
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Study history reset.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  message:
                    type: string
                  ok:
                    type: boolean
                  cleared:
                    type: object
                    additionalProperties:
                      type: integer
                      nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/auth/export:
    get:
      tags: [Auth]
      summary: Export authenticated user data
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile plus study data.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  user:
                    $ref: "#/components/schemas/UserProfile"
                  bookmarks:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  completions:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  material_study_sessions:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/public/subjects:
    get:
      tags: [Public]
      summary: List public subjects
      security: []
      responses:
        "200":
          description: Public subject listing.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/subjects:
    get:
      tags: [Subjects]
      summary: List subjects
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/YearQuery"
        - $ref: "#/components/parameters/SemesterQuery"
      responses:
        "200":
          description: Subjects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/subjects/progress-summary:
    get:
      tags: [Subjects]
      summary: Get user progress summary for subjects
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/YearQuery"
      responses:
        "200":
          description: Subject progress keyed by subject id.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Set to no-store.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  progress:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/SubjectProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/subjects/{id}:
    get:
      tags: [Subjects]
      summary: Get subject with grouped resources
      security: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Subject with notes, books, PYQs, syllabus, and PPTs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectWithResources"
        "404":
          $ref: "#/components/responses/PlainNotFound"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/subjects/{id}/notes:
    get:
      tags: [Subjects]
      summary: Get materials for a subject
      security: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Subject notes/materials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyMaterial"
        "404":
          $ref: "#/components/responses/PlainNotFound"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/subjects/{id}/progress:
    get:
      tags: [Subjects]
      summary: Get authenticated user's progress for a subject
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Subject progress.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Set to no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/subjects/{id}/units:
    get:
      tags: [Subjects]
      summary: Get subject units
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Units found from active note materials.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/notes:
    get:
      tags: [Notes]
      summary: List active study materials
      security:
        - BearerAuth: []
      parameters:
        - name: subjectId
          in: query
          schema:
            type: string
        - name: subject_id
          in: query
          schema:
            type: string
        - name: materialType
          in: query
          schema:
            $ref: "#/components/schemas/MaterialType"
        - name: material_type
          in: query
          schema:
            $ref: "#/components/schemas/MaterialType"
      responses:
        "200":
          description: Active study materials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyMaterial"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/notes/metadata:
    get:
      tags: [Notes]
      summary: List material metadata
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active study material metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyMaterial"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/notes/subjects/{subjectId}:
    get:
      tags: [Notes]
      summary: List materials by subject
      security:
        - BearerAuth: []
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
        - name: materialType
          in: query
          schema:
            $ref: "#/components/schemas/MaterialType"
        - name: material_type
          in: query
          schema:
            $ref: "#/components/schemas/MaterialType"
      responses:
        "200":
          description: Materials for subject.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyMaterial"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/notes/{id}/search:
    get:
      tags: [Notes, Search]
      summary: Search within a single note route
      description: The router registers `{id}`, while the controller currently reads `req.params.noteId`; this spec follows the registered production path.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/SearchQueryRequired"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: Search results scoped by note when controller receives the note id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/notes/{id}:
    get:
      tags: [Notes]
      summary: Get active study material by id
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Study material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyMaterial"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PlainNotFound"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/search:
    get:
      tags: [Search]
      summary: Search active study material metadata
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SearchQueryRequired"
        - name: subjectId
          in: query
          schema:
            type: string
        - name: noteId
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/YearQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: Paginated search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/search/suggest:
    get:
      tags: [Search]
      summary: Get autocomplete suggestions
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - $ref: "#/components/parameters/YearQuery"
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Suggestion strings.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/files/signed-url:
    get:
      tags: [Files]
      summary: Generate signed S3 or CloudFront file URL
      security:
        - BearerAuth: []
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: mode
          in: query
          schema:
            type: string
            enum: [view, download]
      responses:
        "200":
          description: Signed file access URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedFileResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/progress/session/start:
    post:
      tags: [Progress]
      summary: Start deprecated generic study session
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartedAtRequest"
      responses:
        "200":
          description: Deprecated session response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/progress/session/end:
    post:
      tags: [Progress]
      summary: End deprecated generic study session
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndedAtRequest"
      responses:
        "200":
          description: Deprecated session response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/progress/material/{materialId}/start:
    post:
      tags: [Progress]
      summary: Start material study session
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MaterialIdPath"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartedAtRequest"
      responses:
        "200":
          description: Started study session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/progress/material/{materialId}/end:
    post:
      tags: [Progress]
      summary: End material study session
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MaterialIdPath"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndedAtRequest"
      responses:
        "200":
          description: Ended study session or closed zero sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/progress/note/{materialId}/start:
    post:
      tags: [Progress]
      summary: Start note study session alias
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MaterialIdPath"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartedAtRequest"
      responses:
        "200":
          description: Started study session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/progress/note/{materialId}/end:
    post:
      tags: [Progress]
      summary: End note study session alias
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MaterialIdPath"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndedAtRequest"
      responses:
        "200":
          description: Ended study session or closed zero sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/progress/analytics:
    get:
      tags: [Progress]
      summary: Get authenticated user's progress analytics
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Aggregated user progress analytics.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Set to no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/bookmarks:
    get:
      tags: [Bookmarks]
      summary: List current user's bookmarked material ids
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Bookmark ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialIdsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
    post:
      tags: [Bookmarks]
      summary: Add a bookmark
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialIdBody"
      responses:
        "200":
          description: Bookmark added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkMutationResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/bookmarks/details:
    get:
      tags: [Bookmarks]
      summary: List bookmark details
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Detailed bookmarks.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  bookmarks:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookmarkDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/bookmarks/{materialId}:
    delete:
      tags: [Bookmarks]
      summary: Remove a bookmark
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MaterialIdPath"
      responses:
        "200":
          description: Bookmark removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkMutationResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/completions:
    get:
      tags: [Completions]
      summary: List current user's completed material ids
      security:
        - BearerAuth: []
      parameters:
        - name: subjectId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Completion ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialIdsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
    post:
      tags: [Completions]
      summary: Mark a note material complete
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionBody"
      responses:
        "200":
          description: Completion added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionMutationResponse"
        "400":
          $ref: "#/components/responses/PlainBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/PlainServerError"
  /api/completions/count:
    get:
      tags: [Completions]
      summary: Count current user's completed materials
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Completion count.
          content:
